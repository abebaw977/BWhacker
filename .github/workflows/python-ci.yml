# .github/workflows/python-ci.yml
name: Python & C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual re-run from the Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install C Compiler (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Show tools info (debug)
      run: |
        python -V
        gcc --version

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        set -e
        if [ -f requirements.txt ]; then
          echo "Installing from repo root requirements.txt"
          python -m pip install -r requirements.txt
        else
          echo "No requirements.txt found; installing pytest"
          python -m pip install pytest
        fi

    - name: Compile C Projects (if present)
      run: |
        if [ -d "C_Projects" ]; then
          echo "Compiling C Projects..."
          mkdir -p C_Projects/bin
          for file in C_Projects/*.c; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .c)
              echo "Compiling $file -> C_Projects/bin/$filename"
              gcc "$file" -o "C_Projects/bin/$filename"
            fi
          done
        else
          echo "C_Projects directory not found, skipping..."
        fi

    - name: Run tests if present
      run: |
        if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
          echo "Tests found. Running pytest..."
          python -m pytest -q --maxfail=1
        else
          echo "No tests found in tests/; skipping pytest."
        fi
